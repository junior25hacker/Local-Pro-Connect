{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Login - Local Pro Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0052CC;
            --primary-dark: #0747A6;
            --accent-green: #17B890;
            --accent-yellow: #FFC300;
            --text-dark: #172B4D;
            --text-light: #5E6C84;
            --bg-light: #F4F5F7;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
        }

        h1,
        h2,
        h3 {
            font-family: 'Outfit', sans-serif;
        }

        .signup-container {
            width: 100%;
            max-width: 1100px;
            min-height: 700px;
            margin: 20px;
            display: flex;
            background: white;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 52, 204, 0.15);
            overflow: hidden;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Sidebar Branding */
        .sidebar {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #2563EB 100%);
            position: relative;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('{% static "assets/image/maze.png" %}') center/cover;
            opacity: 0.15;
            z-index: 1;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            z-index: 2;
        }

        .sidebar-content {
            position: relative;
            z-index: 10;
        }

        .brand-logo {
            margin-bottom: 40px;
        }

        .brand-logo img {
            height: 60px;
            filter: brightness(0) invert(1);
        }

        .sidebar h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .sidebar p {
            font-size: 1.25rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        /* Form Side */
        .form-side {
            flex: 1.2;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 10px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 14px 20px;
            border: 2.5px solid #F0F2F5;
            border-radius: 14px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #F8FAFC;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 82, 204, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 82, 204, 0.3);
        }

        .signup-footer {
            margin-top: 40px;
            text-align: center;
            font-size: 1rem;
            color: var(--text-light);
        }

        .signup-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
        }

        .signup-footer a.accent-green {
            color: var(--accent-green);
        }

        .signup-footer .divider {
            margin: 0 10px;
            color: #ddd;
        }

        /* Alerts */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-danger {
            background: #FFF5F5;
            color: #E53E3E;
            border: 1px solid #FED7D7;
        }

        .alert-success {
            background: #F0FFF4;
            color: #38A169;
            border: 1px solid #C6F6D5;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .signup-container {
                flex-direction: column;
                max-width: 500px;
            }

            .sidebar {
                padding: 40px;
                min-height: 250px;
            }

            .sidebar h1 {
                font-size: 2.5rem;
            }

            .form-side {
                padding: 40px;
            }
        }
    </style>
</head>

<body>
    <div class="signup-container">
        <!-- Left Side: Branding -->
        <div class="sidebar">
            <div class="sidebar-content">
                <div class="brand-logo">
                    <img src="{% static 'assets/image/newlogo.png' %}" alt="Local Pro Connect Logo">
                </div>
                <h1>Welcome <br>Back</h1>
                <p>Connect with local professionals and get things done quickly and reliably.</p>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="form-side">
            <div class="form-header">
                <h2>Sign In</h2>
                <p>Access your account to continue.</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        autofocus>
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span
                            class="text-secondary small fw-normal">(Optional)</span></label>
                    <input type="email" id="email" name="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Sign In <i
                        class="fas fa-arrow-right ms-2"></i></button>
            </form>

            <div id="countdownBox" style="display:none; text-align:center; margin-top:1.5rem;">
                <div class="alert alert-success" style="margin-bottom:0;">
                    <i class="fas fa-check-circle me-2"></i>
                    <span id="countdownText">Redirecting in 5 seconds...</span>
                </div>
            </div>

            <div class="signup-footer">
                <p>Don't have an account?</p>
                <div class="mt-3">
                    <a href="/accounts/register/user/">Sign up as User</a>
                    <span class="divider">|</span>
                    <a href="/accounts/register/provider/" class="accent-green">Become a Pro</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        let countdownInterval = null;
        let csrfToken = null;

        // Get the Django API endpoint dynamically
        function getDjangoEndpoint() {
            // Always use relative URL for production compatibility
            return '/accounts/auth/';
        }

        // Fetch CSRF token when page loads
        async function initializeCSRFToken() {
            try {
                const response = await fetch(getDjangoEndpoint(), {
                    method: 'GET',
                    credentials: 'include'
                });

                // Extract CSRF token from cookie
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith('csrftoken=')) {
                        csrfToken = cookie.substring('csrftoken='.length);
                        console.log('CSRF Token initialized');
                        break;
                    }
                }
            } catch (err) {
                console.log('Note: CSRF token initialization attempted');
            }
        }

        async function loginUser(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const countdownBox = document.getElementById('countdownBox');

            alertBox.innerHTML = '';
            countdownBox.style.display = 'none';

            // Client-side validation
            if (!username) {
                showError('Please enter your username.');
                return;
            }
            if (!password) {
                showError('Please enter your password.');
                return;
            }

            // Disable submit button during login
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Signing in...';

            try {
                let body = `action=signin&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
                if (email) {
                    body += `&email=${encodeURIComponent(email)}`;
                }

                // Include 'next' parameter if present in URL (for redirect after login)
                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get('next');
                if (nextUrl) {
                    body += `&next=${encodeURIComponent(nextUrl)}`;
                }

                // Get CSRF token - try multiple sources
                const token = csrfToken || getCookie('csrftoken');

                const endpoint = getDjangoEndpoint();
                console.log('Sending login request to:', endpoint);
                console.log('Request body:', body);

                const response = await fetch(endpoint, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': token || ''
                    },
                    body: body
                });

                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);

                let data;
                try {
                    data = await response.json();
                    console.log('Response data:', data);
                } catch (parseErr) {
                    console.error('Failed to parse response as JSON:', parseErr);
                    console.log('Response text:', await response.text());
                    throw new Error('Invalid response from server');
                }

                if (response.ok && data.success) {
                    console.log('Login successful!');
                    // Hide form and show countdown
                    document.getElementById('loginForm').style.display = 'none';
                    alertBox.style.display = 'none';
                    countdownBox.style.display = 'block';

                    // Start 5-second countdown
                    startCountdown(data.redirect, data.success);
                } else if (data.error) {
                    console.log('Login error from server:', data.error);
                    showError(data.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Sign In <i class="fas fa-arrow-right ms-2"></i>';
                } else {
                    console.log('Unexpected response:', { ok: response.ok, data: data });
                    showError('Login failed. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Sign In <i class="fas fa-arrow-right ms-2"></i>';
                }
            } catch (err) {
                console.error('Login error:', err);
                console.error('Error message:', err.message);
                console.error('Error stack:', err.stack);

                // Provide more specific error messages
                let errorMessage = 'An error occurred. Please check your connection and try again.';
                if (err instanceof TypeError) {
                    errorMessage = 'Network error. Please try again or contact support if the problem persists.';
                }

                showError(errorMessage);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Sign In <i class="fas fa-arrow-right ms-2"></i>';
            }
        }

        function startCountdown(redirectUrl, successMessage) {
            let timeRemaining = 5;
            const countdownText = document.getElementById('countdownText');
            const alertBox = document.getElementById('alertBox');

            // Show success message
            alertBox.style.display = 'block';
            alertBox.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle me-2"></i>' + successMessage + '</div>';

            // Update countdown every second
            countdownInterval = setInterval(() => {
                timeRemaining--;
                countdownText.textContent = `Redirecting in ${timeRemaining} second${timeRemaining !== 1 ? 's' : ''}...`;

                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = redirectUrl;
                }
            }, 1000);
        }

        function showError(message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle me-2"></i>' + message + '</div>';
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function getCSRFToken() {
            // Try multiple methods to get CSRF token
            
            // Method 1: From meta tag (most reliable)
            const metaToken = document.querySelector('meta[name="csrf-token"]');
            if (metaToken && metaToken.getAttribute('content')) {
                return metaToken.getAttribute('content');
            }
            
            // Method 2: From cookie
            const cookieValue = getCookie('csrftoken');
            if (cookieValue) {
                return cookieValue;
            }
            
            // Method 3: From hidden form field
            const hiddenInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
            if (hiddenInput && hiddenInput.value) {
                return hiddenInput.value;
            }
            
            console.error('CSRF token not found');
            return null;
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Initialize CSRF token and form event listener when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize CSRF token
            initializeCSRFToken();

            // Add form event listener
            document.getElementById('loginForm').addEventListener('submit', loginUser);
        });

        // Clean up interval on page unload
        window.addEventListener('beforeunload', () => {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });
    </script>
</body>

</html>
